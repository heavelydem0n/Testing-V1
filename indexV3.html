  function demoCall(action, p) {

      db.user={...u}; return {user:{...u},token:'preview'};
    }
    if(action==='logout') return true;
    if(!db.user) throw new Error('Sesi berakhir. Silakan masuk kembali.');
    const admin = db.user.role==='admin';
    if(['adminDashboard','report','saveEmployee','deleteEmployee','saveBranch','deleteBranch','saveSchedule','deleteSchedule','saveSettings'].includes(action)&&!admin) throw new Error('Akses hanya tersedia untuk administrator.');
    const employee = db.employees.find(x=>x.id===db.user.id);
    const branch = db.branches.find(x=>x.id===employee.branchId);
    if(action==='me') return {user:db.user};
    if(action==='bootstrap') return {user:db.user,employee,branch,schedule:db.schedules.find(x=>x.branchId===employee.branchId),settings:db.settings,branches:admin?db.branches:[],employees:admin?db.employees.filter(x=>x.role==='employee'):[],schedules:admin?db.schedules:[],today:db.attendance.filter(x=>x.date===dayKey()),mine:db.attendance.filter(x=>x.employeeId===db.user.id)};
    if(action==='attendanceMine') return db.attendance.filter(x=>x.employeeId===db.user.id).sort((a,b)=>b.timestamp.localeCompare(a.timestamp));
    if(action==='attendanceCreate') {
      const today=dayKey();
      if(db.attendance.some(x=>x.employeeId===db.user.id&&x.date===today&&x.type===p.type)) throw new Error('Absensi untuk jenis ini sudah tercatat hari ini.');
      const meters=distance(p.location.lat,p.location.lng,branch.lat,branch.lng);
      if(meters>branch.radius) throw new Error(`Lokasi Anda ${Math.round(meters)} m dari bengkel, di luar radius ${branch.radius} m.`);
      const ts=new Date();const sched=db.schedules.find(x=>x.branchId===employee.branchId);const late=p.type==='IN'&&ts.getHours()*60+ts.getMinutes()>Number(sched.start.split(':')[0])*60+Number(sched.start.split(':')[1])+Number(sched.graceMinutes)?'Terlambat':'Tepat waktu';
      const row={id:'ATT-'+Date.now(),employeeId:employee.id,employeeName:employee.name,branchId:employee.branchId,unit:employee.unit,date:today,type:p.type,timestamp:ts.toISOString(),status:p.type==='OUT'?'Pulang':late,lat:p.location.lat,lng:p.location.lng,distance:Math.round(meters),photoData:p.photoData,scheduleId:sched.id};db.attendance.unshift(row);return row;
    }
    if(action==='adminDashboard'||action==='report') return db.attendance.slice().sort((a,b)=>b.timestamp.localeCompare(a.timestamp));
    if(action==='saveEmployee') { const v=p.employee; const old=db.employees.findIndex(x=>x.id===v.id);db.employees[old<0?'push':'splice'](...(old<0?[{...v,role:'employee'}]:[old,1,{...db.employees[old],...v}]));return v; }
    if(action==='deleteEmployee') {db.employees=db.employees.filter(x=>x.id!==p.id);return true;}
    if(action==='saveBranch') {const v=p.branch;const old=db.branches.findIndex(x=>x.id===v.id);if(old<0)db.branches.push(v);else db.branches[old]=v;return v;}
    if(action==='deleteBranch') {db.branches=db.branches.filter(x=>x.id!==p.id);return true;}
    if(action==='saveSchedule') {const v=p.schedule;const old=db.schedules.findIndex(x=>x.id===v.id);if(old<0)db.schedules.push(v);else db.schedules[old]=v;return v;}
    if(action==='deleteSchedule') {db.schedules=db.schedules.filter(x=>x.id!==p.id);return true;}
    if(action==='saveSettings'){db.settings=p.settings;return db.settings;}
    throw new Error('Fitur pratinjau ini belum tersedia.');

  function filteredRows(){const search=(state.filters.search||'').toLowerCase(),branch=state.filters.branch,unit=state.filters.unit,status=state.filters.status,range=state.reportRange||'today',now=new Date();return (state.data.attendance||[]).filter(r=>{const dt=new Date(r.date+'T12:00:00');const dateOk=range==='all'||(range==='today'?r.date===dayKey(now):range==='week'?dt>=new Date(now-7*86400000):r.date.slice(0,7)===dayKey(now).slice(0,7));return(!search||`${r.employeeName} ${r.employeeId}`.toLowerCase().includes(search))&&(!branch||r.branchId===branch)&&(!unit||r.unit===unit)&&(!status||r.status===status)&&dateOk;}).sort((a,b)=>b.timestamp.localeCompare(a.timestamp));}
  function attendanceView(){const rows=filteredRows();return `<div class="page-heading"><div><h1>Laporan absensi</h1><p>Filter aktivitas kehadiran dan ekspor laporan ke CSV.</p></div><button class="primary-button" id="markLeave">＋ Catat izin</button></div><div class="card"><div class="card-header"><h3>Catatan kehadiran <span class="subtext">(${rows.length} entri)</span></h3></div>${filterControls()}<div style="height:15px"></div>${adminAttendanceTable(rows)}</div>`;}
  function adminAttendanceTable(rows){return rows.length?`<div class="table-wrap"><table><thead><tr><th>Karyawan</th><th>Tanggal</th><th>Jenis</th><th>Waktu</th><th>Cabang</th><th>Unit</th><th>Lokasi</th><th>Status</th><th>Selfie</th></tr></thead><tbody>${rows.map(r=>{const b=(state.data.branches||[]).find(x=>x.id===r.branchId);return `<tr><td><div class="employee-cell"><div class="avatar">${initials(r.employeeName)}</div><div><strong>${safe(r.employeeName)}</strong><div class="subtext">${safe(r.employeeId)}</div></div></div></td><td>${safe(r.date)}</td><td>${r.type==='IN'?'Masuk':'Pulang'}</td><td>${timeOf(r.timestamp)}</td><td>${safe(b?.name||r.branchId)}</td><td>${safe(r.unit)}</td><td>${r.lat!=null?`<a href="https://www.google.com/maps?q=${r.lat},${r.lng}" target="_blank" rel="noopener">⌖ ${r.distance??'—'} m</a>`:'—'}</td><td>${badge(r.status)}</td><td>${r.photoId?`<button class="small-link" data-photo-id="${safe(r.photoId)}">Lihat</button>`:'—'}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Tidak ada absensi yang cocok dengan filter ini.</div>';}
  function employeesView(){return `<div class="page-heading"><div><h1>Data karyawan</h1><p>Kelola profil, unit kerja, cabang, dan status akses.</p></div><button class="primary-button" id="addEmployee">＋ Karyawan baru</button></div><div class="card"><div class="card-header"><h3>Tim bengkel</h3><span class="subtext">${state.data.employees.length} karyawan aktif</span></div><div class="table-wrap"><table><thead><tr><th>Nama karyawan</th><th>ID</th><th>Jabatan</th><th>Cabang</th><th>Unit</th><th>Status</th><th></th></tr></thead><tbody>${state.data.employees.map(e=>`<tr><td><div class="employee-cell"><div class="avatar">${initials(e.name)}</div><strong>${safe(e.name)}</strong></div></td><td>${safe(e.id)}</td><td>${safe(e.title)}</td><td>${safe((state.data.branches.find(b=>b.id===e.branchId)||{}).name||e.branchId)}</td><td>${safe(e.unit)}</td><td>${e.active?'<span class="badge green">Aktif</span>':'<span class="badge gray">Nonaktif</span>'}</td><td><button class="small-link" data-edit-employee="${safe(e.id)}">Edit</button></td></tr>`).join('')}</tbody></table></div></div>`;}
  function branchesView(){return `<div class="page-heading"><div><h1>Cabang bengkel</h1><p>Atur titik lokasi dan radius validasi absensi setiap cabang.</p></div><button class="primary-button" id="addBranch">＋ Tambah cabang</button></div><div class="stats-grid">${state.data.branches.map(b=>`<div class="card"><div class="card-header"><span class="badge gray">${safe(b.id)}</span><span><button class="small-link" data-edit-branch="${safe(b.id)}">Edit</button> <button class="danger-link" data-deactivate-branch="${safe(b.id)}">Nonaktifkan</button></span></div><h3 style="font:700 15px Manrope;margin:0 0 7px">${safe(b.name)}</h3><div class="subtext">${safe(b.address||'Alamat belum diisi')}</div><div class="notice">⌖ ${Number(b.lat).toFixed(5)}, ${Number(b.lng).toFixed(5)}<br>Radius absensi: ${safe(b.radius)} meter</div></div>`).join('')}</div>`;}
  function schedulesView(){return `<div class="page-heading"><div><h1>Jadwal kerja</h1><p>Atur jam kerja dan batas toleransi keterlambatan.</p></div><button class="primary-button" id="addSchedule">＋ Jadwal baru</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Nama jadwal</th><th>Cabang</th><th>Hari kerja</th><th>Jam masuk</th><th>Jam pulang</th><th>Toleransi</th><th></th></tr></thead><tbody>${state.data.schedules.map(s=>`<tr><td><strong>${safe(s.name)}</strong></td><td>${safe((state.data.branches.find(b=>b.id===s.branchId)||{}).name||s.branchId)}</td><td>${safe(s.days)}</td><td>${safe(s.start)}</td><td>${safe(s.end)}</td><td>${safe(s.graceMinutes)} menit</td><td><button class="small-link" data-edit-schedule="${safe(s.id)}">Edit</button> <button class="danger-link" data-deactivate-schedule="${safe(s.id)}">Nonaktifkan</button></td></tr>`).join('')}</tbody></table></div></div>`;}
  function settingsView(){return `<div class="page-heading"><div><h1>Pengaturan absensi</h1><p>Atur status layanan absensi untuk seluruh karyawan.</p></div></div><div class="card" style="max-width:650px"><form id="settingsForm"><div class="field"><label><input type="checkbox" name="attendanceEnabled" ${state.data.settings.attendanceEnabled?'checked':''}/> Absensi sedang dibuka</label></div><div class="notice success">Validasi kamera, selfie, GPS, dan radius cabang selalu aktif untuk setiap catatan absensi. Fitur ini menjaga bukti kehadiran tetap lengkap dan lokasi tetap terverifikasi.</div><div class="notice warning">Pastikan koordinat cabang dan radius telah sesuai sebelum absensi diaktifkan. Foto selfie disimpan di Google Drive dengan akses privat.</div><div class="modal-actions"><button class="primary-button">Simpan pengaturan</button></div></form></div>`;}
  function bindAppEvents(){ $$('.nav-button,[data-section]').forEach(b=>b.addEventListener('click',()=>{state.section=b.dataset.section;$('#sidebar')?.classList.remove('open');renderApp();}));$('#logout')?.addEventListener('click',logout);$('#mobileMenu')?.addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$('#mobileMore')?.addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$$('[data-attend]').forEach(b=>b.addEventListener('click',()=>b.dataset.attend&&openAttendance(b.dataset.attend)));$('#refresh')?.addEventListener('click',refreshData);$('#addEmployee')?.addEventListener('click',()=>employeeModal());$$('[data-edit-employee]').forEach(b=>b.addEventListener('click',()=>employeeModal(state.data.employees.find(x=>x.id===b.dataset.editEmployee))));$('#addBranch')?.addEventListener('click',()=>branchModal());$$('[data-edit-branch]').forEach(b=>b.addEventListener('click',()=>branchModal(state.data.branches.find(x=>x.id===b.dataset.editBranch))));$$('[data-deactivate-branch]').forEach(b=>b.addEventListener('click',()=>deactivate('deleteBranch',b.dataset.deactivateBranch,'Nonaktifkan cabang ini?')));$('#addSchedule')?.addEventListener('click',()=>scheduleModal());$$('[data-edit-schedule]').forEach(b=>b.addEventListener('click',()=>scheduleModal(state.data.schedules.find(x=>x.id===b.dataset.editSchedule))));$$('[data-deactivate-schedule]').forEach(b=>b.addEventListener('click',()=>deactivate('deleteSchedule',b.dataset.deactivateSchedule,'Nonaktifkan jadwal ini?')));$('#settingsForm')?.addEventListener('submit',saveSettings);$('#markLeave')?.addEventListener('click',leaveModal);['filterSearch','filterBranch','filterUnit','filterStatus','reportRange'].forEach(id=>$('#'+id)?.addEventListener(id==='filterSearch'?'input':'change',e=>{if(id==='reportRange')state.reportRange=e.target.value;else if(id==='filterSearch')state.filters.search=e.target.value;else if(id==='filterBranch')state.filters.branch=e.target.value;else if(id==='filterUnit')state.filters.unit=e.target.value;else state.filters.status=e.target.value;renderApp();const inp=$('#filterSearch');if(inp&&id==='filterSearch'){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}}));$('#exportCsv')?.addEventListener('click',exportCsv);$$('[data-photo]').forEach(b=>b.addEventListener('click',()=>openImage(b.dataset.photo)));$$('[data-photo-id]').forEach(b=>b.addEventListener('click',()=>viewPhoto(b.dataset.photoId)));}
  async function logout(){try{await api.call('logout');}catch{}sessionStorage.removeItem('attendanceToken');state.user=null;state.data=null;renderLogin();}
  async function refreshData(){try{state.data=await api.call('bootstrap');renderApp();showToast('Data berhasil diperbarui.','success');}catch(e){showToast(e.message,'error');}}
  function exportCsv(){const rows=filteredRows(),headers=['ID Absensi','ID Karyawan','Nama','Tanggal','Jenis','Waktu Server','Cabang','Unit','Status','Latitude','Longitude','Jarak (m)'];const lines=[headers,...rows.map(r=>[r.id,r.employeeId,r.employeeName,r.date,r.type==='IN'?'Masuk':'Pulang',new Date(r.timestamp).toLocaleString('id-ID',{timeZone:'Asia/Jakarta'}),(state.data.branches.find(b=>b.id===r.branchId)||{}).name||r.branchId,r.unit,r.status,r.lat,r.lng,r.distance])];const csv='\uFEFF'+lines.map(line=>line.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`laporan-absensi-${dayKey()}.csv`;a.click();URL.revokeObjectURL(url);}
  function modal(title,description,body){const old=$('.modal-backdrop');old?.remove();app.insertAdjacentHTML('beforeend',`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><h3>${title}</h3><p>${description}</p></div><button class="close-button" id="closeModal">✕</button></div>${body}</div></div>`);$('.modal-backdrop').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal();});$('#closeModal').addEventListener('click',closeModal);}
  function closeModal(){cleanupCamera();$('.modal-backdrop')?.remove();pendingAttendance=null;currentPhoto='';currentGeo=null;}
  function openAttendance(type){const emp=state.data.employee,branch=state.data.branch||{},label=type==='IN'?'masuk':'pulang';pendingAttendance=type;currentPhoto='';currentGeo=null;modal(`Absensi ${label}`,`Pastikan selfie dan lokasi Anda siap sebelum mengirim.`, `<div class="camera-box" id="cameraBox"><div class="camera-placeholder"><span class="camera-symbol">◎</span><span>Kamera belum dinyalakan</span></div></div><p class="camera-help">Kami meminta akses kamera untuk mengambil selfie verifikasi, dan akses lokasi untuk memastikan Anda berada di area bengkel.</p><div class="action-row"><button class="secondary-button" id="startCamera">◎ Aktifkan kamera</button><button class="secondary-button" id="takePhoto" disabled>Ambil selfie</button><button class="secondary-button" id="retakePhoto" hidden>Ambil ulang</button></div><div style="height:12px"></div><div class="location-card"><div><div class="subtext">LOKASI PERANGKAT</div><strong id="locationStatus">Belum diperiksa</strong></div><button class="secondary-button" id="getLocation">⌖ Ambil lokasi</button></div><div class="notice" id="attendanceGuidance">Cabang: ${safe(branch.name||'—')} · Radius valid: ${safe(branch.radius||150)} meter</div><div class="modal-actions"><button class="secondary-button" id="cancelAttendance">Batal</button><button class="primary-button" id="submitAttendance" disabled>Konfirmasi absen ${label}</button></div>`);$('#startCamera').onclick=startCamera;$('#takePhoto').onclick=takePhoto;$('#retakePhoto').onclick=()=>{currentPhoto='';$('#cameraBox').innerHTML='<video id="cameraVideo" autoplay playsinline muted></video>';$('#cameraVideo').srcObject=cameraStream;$('#takePhoto').hidden=false;$('#takePhoto').disabled=false;$('#retakePhoto').hidden=true;$('#submitAttendance').disabled=true;};$('#getLocation').onclick=getLocation;$('#cancelAttendance').onclick=closeModal;$('#submitAttendance').onclick=submitAttendance;}
  async function startCamera(){try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Browser ini tidak mendukung kamera. Buka melalui HTTPS di ponsel atau komputer.');cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:960},height:{ideal:720}},audio:false});$('#cameraBox').innerHTML='<video id="cameraVideo" autoplay playsinline muted></video>';$('#cameraVideo').srcObject=cameraStream;$('#takePhoto').disabled=false;showToast('Kamera siap. Ambil selfie saat pencahayaan cukup.','success');}catch(e){showToast(e.name==='NotAllowedError'?'Izin kamera ditolak. Aktifkan akses kamera pada pengaturan browser lalu coba lagi.':e.message,'error');}}
  function takePhoto(){const video=$('#cameraVideo');if(!video||!video.videoWidth)return showToast('Kamera belum siap. Coba lagi sebentar.','error');const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);currentPhoto=canvas.toDataURL('image/jpeg',.78);$('#cameraBox').innerHTML=`<img alt="Pratinjau selfie" src="${currentPhoto}"/>`;$('#takePhoto').hidden=true;$('#retakePhoto').hidden=false;maybeEnableSubmit();}
  function getLocation(){const status=$('#locationStatus');status.textContent='Meminta izin lokasi…';if(!navigator.geolocation){status.textContent='GPS tidak tersedia';showToast('Perangkat atau browser tidak menyediakan GPS. Absensi tidak dapat dilanjutkan.','error');return;}navigator.geolocation.getCurrentPosition(pos=>{currentGeo={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy};const branch=state.data.branch||{};const meters=distance(currentGeo.lat,currentGeo.lng,branch.lat,branch.lng);status.textContent=`${Math.round(meters)} m dari bengkel · akurasi ±${Math.round(currentGeo.accuracy)} m`;status.title=`${currentGeo.lat}, ${currentGeo.lng}`;const msg=$('#attendanceGuidance');if(meters>Number(branch.radius)){msg.className='notice warning';msg.textContent=`Lokasi Anda di luar radius. Geser ke dalam area bengkel (batas ${branch.radius} m) untuk mencatat absensi.`;showToast('Anda berada di luar radius bengkel. Absensi tidak dapat dicatat sebagai valid.','error');}else{msg.className='notice success';msg.innerHTML=`Lokasi terverifikasi dalam radius cabang. <a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${currentGeo.lat},${currentGeo.lng}">Lihat peta ↗</a>`;showToast('Lokasi berhasil ditemukan.','success');}maybeEnableSubmit();},err=>{status.textContent='Lokasi tidak tersedia';const msg=err.code===1?'Izin lokasi ditolak. Izinkan lokasi di browser dan pastikan GPS aktif.':err.code===2?'GPS tidak dapat menentukan posisi. Coba di area terbuka dan periksa pengaturan lokasi.':'Permintaan lokasi melewati batas waktu. Coba lagi.';$('#attendanceGuidance').className='notice warning';$('#attendanceGuidance').textContent=msg;showToast(msg,'error');currentGeo=null;$('#submitAttendance').disabled=true;},{enableHighAccuracy:true,timeout:15000,maximumAge:0});}
  function maybeEnableSubmit(){const branch=state.data.branch||{},within=currentGeo&&distance(currentGeo.lat,currentGeo.lng,branch.lat,branch.lng)<=Number(branch.radius||0);$('#submitAttendance').disabled=!(currentPhoto&&within);}
  async function submitAttendance(){if(!currentPhoto)return showToast('Ambil selfie terlebih dahulu.','error');if(!currentGeo)return showToast('Lokasi GPS diperlukan untuk absensi.','error');const branch=state.data.branch||{};if(distance(currentGeo.lat,currentGeo.lng,branch.lat,branch.lng)>Number(branch.radius)){showToast('Lokasi berada di luar radius bengkel.','error');return;}const b=$('#submitAttendance');b.disabled=true;b.textContent='Mengirim absensi…';try{await api.call('attendanceCreate',{type:pendingAttendance,location:currentGeo,photoData:currentPhoto});closeModal();state.data=await api.call('bootstrap');renderApp();showToast('Absensi berhasil dicatat. Terima kasih!','success');}catch(e){b.disabled=false;b.textContent='Coba lagi';showToast(e.message,'error');}}
  function openImage(src){modal('Bukti selfie','Foto tersimpan sebagai bagian dari catatan absensi.','<img style="width:100%;border-radius:10px" alt="Selfie absensi" src="'+src+'"/><div class="modal-actions"><button id="doneImage" class="secondary-button">Tutup</button></div>');$('#doneImage').onclick=closeModal;}
  async function viewPhoto(id){try{const data=await api.call('getPhoto',{photoId:id});openImage(`data:${data.mimeType};base64,${data.base64}`);}catch(e){showToast(e.message,'error');}}
  function inputField(label,name,value='',type='text',required=true){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" ${type==='number'?'step="any"':''} value="${safe(value)}" ${required?'required':''}/></div>`;}
  function employeeModal(emp={id:'',name:'',title:'Teknisi Body Repair',branchId:state.data.branches[0]?.id||'',unit:'Toyota',active:true}){const editing=!!emp.id;modal(editing?'Edit karyawan':'Tambah karyawan','Lengkapi data profil karyawan bengkel.',`<form id="employeeForm"><div class="form-grid">${inputField('ID Karyawan','id',emp.id,'text',!editing)}${inputField('Nama lengkap','name',emp.name)}${inputField('Jabatan','title',emp.title)}<div class="field"><label>Unit kerja</label><select name="unit"><option ${emp.unit==='Toyota'?'selected':''}>Toyota</option><option ${emp.unit==='Daihatsu'?'selected':''}>Daihatsu</option></select></div><div class="field"><label>Cabang</label><select name="branchId">${state.data.branches.map(b=>`<option value="${b.id}" ${emp.branchId===b.id?'selected':''}>${safe(b.name)}</option>`).join('')}</select></div><div class="field"><label>Status akun</label><select name="active"><option value="true" ${emp.active?'selected':''}>Aktif</option><option value="false" ${!emp.active?'selected':''}>Nonaktif</option></select></div>${inputField(editing?'Kata sandi baru (opsional)':'Kata sandi awal','password','','password',!editing)}</div><div class="modal-actions"><button type="button" id="deleteEmployee" class="danger-link" style="margin-right:auto" ${editing?'':'hidden'}>Nonaktifkan</button><button type="button" class="secondary-button" id="cancelForm">Batal</button><button class="primary-button">Simpan data</button></div></form>`);$('#cancelForm').onclick=closeModal;$('#employeeForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));v.active=v.active==='true';saveEntity('saveEmployee','employee',v);};$('#deleteEmployee').onclick=async()=>{if(!confirm('Nonaktifkan karyawan ini?'))return;try{await api.call('deleteEmployee',{id:emp.id});closeModal();await refreshData();}catch(e){showToast(e.message,'error');}};}
  function branchModal(b={id:'',name:'',address:'',lat:'',lng:'',radius:150}){modal(b.id?'Edit cabang':'Tambah cabang','Titik tengah bengkel digunakan untuk memvalidasi radius absensi.',`<form id="branchForm"><div class="form-grid">${inputField('ID cabang','id',b.id,'text',!b.id)}${inputField('Nama cabang','name',b.name)}<div class="full">${inputField('Alamat','address',b.address)}</div>${inputField('Latitude','lat',b.lat,'number')}${inputField('Longitude','lng',b.lng,'number')}${inputField('Radius absensi (meter)','radius',b.radius,'number')}</div><div class="notice">Isi koordinat bengkel dengan teliti. Karyawan di luar radius ini akan ditolak backend.</div><div class="modal-actions"><button type="button" id="cancelForm" class="secondary-button">Batal</button><button class="primary-button">Simpan cabang</button></div></form>`);$('#cancelForm').onclick=closeModal;$('#branchForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));v.lat=Number(v.lat);v.lng=Number(v.lng);v.radius=Number(v.radius);saveEntity('saveBranch','branch',v);};}
  function scheduleModal(s={id:'',name:'',branchId:state.data.branches[0]?.id||'',start:'08:00',end:'17:00',graceMinutes:10,days:'Senin–Sabtu',active:true}){modal(s.id?'Edit jadwal':'Tambah jadwal','Jam masuk dan toleransi dipakai untuk menentukan status tepat waktu.',`<form id="scheduleForm"><div class="form-grid">${inputField('ID jadwal','id',s.id,'text',!s.id)}${inputField('Nama jadwal','name',s.name)}<div class="field full"><label>Cabang</label><select name="branchId">${state.data.branches.map(b=>`<option value="${b.id}" ${s.branchId===b.id?'selected':''}>${safe(b.name)}</option>`).join('')}</select></div>${inputField('Jam masuk','start',s.start,'time')}${inputField('Jam pulang','end',s.end,'time')}${inputField('Toleransi (menit)','graceMinutes',s.graceMinutes,'number')}${inputField('Hari kerja','days',s.days)}</div><div class="modal-actions"><button type="button" id="cancelForm" class="secondary-button">Batal</button><button class="primary-button">Simpan jadwal</button></div></form>`);$('#cancelForm').onclick=closeModal;$('#scheduleForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));v.graceMinutes=Number(v.graceMinutes);saveEntity('saveSchedule','schedule',v);};}
  async function saveEntity(action,key,value){try{await api.call(action,{[key]:value});closeModal();state.data=await api.call('bootstrap');renderApp();showToast('Data berhasil disimpan.','success');}catch(e){showToast(e.message,'error');}}
  async function deactivate(action,id,message){if(!confirm(message))return;try{await api.call(action,{id});state.data=await api.call('bootstrap');renderApp();showToast('Data berhasil dinonaktifkan.','success');}catch(e){showToast(e.message,'error');}}
  async function saveSettings(e){e.preventDefault();const f=new FormData(e.target);try{await api.call('saveSettings',{settings:{attendanceEnabled:f.has('attendanceEnabled'),requireLocation:true,requirePhoto:true}});await refreshData();showToast('Pengaturan berhasil disimpan.','success');}catch(err){showToast(err.message,'error');}}
  function leaveModal(){modal('Catat izin / ketidakhadiran','Perubahan dicatat pada log aktivitas administrator.',`<form id="leaveForm"><div class="field"><label>Karyawan</label><select name="employeeId" required>${state.data.employees.map(e=>`<option value="${safe(e.id)}">${safe(e.name)} · ${safe(e.id)}</option>`).join('')}</select></div>${inputField('Tanggal','date',dayKey(),'date')}<div class="field"><label>Status</label><select name="status"><option>Izin</option><option>Tidak hadir</option></select></div><div class="field"><label>Catatan (opsional)</label><textarea name="note" rows="2" maxlength="250" placeholder="Contoh: sakit dengan surat dokter"></textarea></div><div class="modal-actions"><button type="button" id="cancelForm" class="secondary-button">Batal</button><button class="primary-button">Simpan status</button></div></form>`);$('#cancelForm').onclick=closeModal;$('#leaveForm').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));try{await api.call('markLeave',v);closeModal();state.data=await api.call('bootstrap');renderApp();showToast('Status absensi berhasil disimpan.','success');}catch(err){showToast(err.message,'error');}};}
  function tick(){const el=$('#liveClock');if(el)el.textContent=timeOf(new Date().toISOString());}
  if(sessionStorage.getItem('attendanceToken')&&!DEMO)loadApp();else renderLogin();setInterval(tick,15000);
})();
